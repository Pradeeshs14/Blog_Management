<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f1115;
            color: #ffffff;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            background: #181b21;
            padding: 25px 30px;
            border-radius: 14px;
            margin-bottom: 30px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            margin: 8px 0 0;
            color: #9ca3af;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #181b21;
            padding: 25px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
            border: 1px solid #252932;
        }

        .card h2 {
            margin: 0;
            font-size: 34px;
        }

        .card p {
            margin-top: 10px;
            color: #9ca3af;
        }

        .chart-container {
            background: #181b21;
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 30px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
            border: 1px solid #252932;
        }

        .chart-container h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .chart-box {
            position: relative;
            height: 350px;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        @media (max-width: 800px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            body {
                padding: 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>My Dashboard</h1>
        <p>Track your blog performance</p>
    </div>

    <div class="stats">

        <div class="card">
            <h2 id="totalPosts">0</h2>
            <p>Total Posts</p>
        </div>

        <div class="card">
            <h2 id="totalComments">0</h2>
            <p>Comments Made</p>
        </div>

        <div class="card">
            <h2 id="totalLikes">0</h2>
            <p>Likes Received</p>
        </div>

        <div class="card">
            <h2 id="totalViews">0</h2>
            <p>Total Views</p>
        </div>

    </div>

    <div class="chart-container">

        <h2>Likes per Post</h2>

        <div class="chart-box">
            <canvas id="likesChart"></canvas>
        </div>

    </div>

    <div class="chart-container">

        <h2>Comments per Post</h2>

        <div class="chart-box">
            <canvas id="commentsChart"></canvas>
        </div>

    </div>

</div>

<script>

    let token = localStorage.getItem("access_token");

    if (!token) {

        token = prompt("Paste your JWT access token:");

        if (token) {
            localStorage.setItem("access_token", token);
        }
    }

    async function loadDashboard() {

        try {

            const response = await fetch("/user/dashboard/", {
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            });

            if (!response.ok) {
                throw new Error("Failed to load dashboard");
            }

            const data = await response.json();

            document.getElementById("totalPosts").textContent =
                data.total_posts;

            document.getElementById("totalComments").textContent =
                data.total_comments;

            document.getElementById("totalLikes").textContent =
                data.total_likes_received;

            document.getElementById("totalViews").textContent =
                data.total_views;


            const postTitles =
                data.posts.map(post => post.title);

            const likes =
                data.posts.map(post => post.likes);

            const comments =
                data.posts.map(post => post.comments);


            new Chart(
                document.getElementById("likesChart"),
                {
                    type: "bar",

                    data: {
                        labels: postTitles,

                        datasets: [{
                            label: "Likes",
                            data: likes,
                            borderWidth: 1
                        }]
                    },

                    options: {
                        responsive: true,
                        maintainAspectRatio: false,

                        plugins: {
                            legend: {
                                labels: {
                                    color: "#ffffff"
                                }
                            }
                        },

                        scales: {
                            x: {
                                ticks: {
                                    color: "#9ca3af"
                                },
                                grid: {
                                    color: "#252932"
                                }
                            },

                            y: {
                                beginAtZero: true,
                                ticks: {
                                    color: "#9ca3af"
                                },
                                grid: {
                                    color: "#252932"
                                }
                            }
                        }
                    }
                }
            );


            new Chart(
                document.getElementById("commentsChart"),
                {
                    type: "bar",

                    data: {
                        labels: postTitles,

                        datasets: [{
                            label: "Comments",
                            data: comments,
                            borderWidth: 1
                        }]
                    },

                    options: {
                        responsive: true,
                        maintainAspectRatio: false,

                        plugins: {
                            legend: {
                                labels: {
                                    color: "#ffffff"
                                }
                            }
                        },

                        scales: {
                            x: {
                                ticks: {
                                    color: "#9ca3af"
                                },
                                grid: {
                                    color: "#252932"
                                }
                            },

                            y: {
                                beginAtZero: true,
                                ticks: {
                                    color: "#9ca3af"
                                },
                                grid: {
                                    color: "#252932"
                                }
                            }
                        }
                    }
                }
            );

        } catch (error) {

            console.error("Dashboard error:", error);

        }
    }

    loadDashboard();

</script>

</body>

</html>
